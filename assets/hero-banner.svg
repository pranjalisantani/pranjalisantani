<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="836" height="236" rx="14" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />
  <rect x="2" y="2" width="836" height="236" rx="14" fill="url(#grid)" />
  <rect x="2" y="2" width="836" height="236" rx="14" fill="url(#glow)" />

  <g transform="translate(36, 32)">
    <!-- Terminal Header / Prompt -->
    <circle cx="0" cy="4" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="16" cy="4" r="5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="32" cy="4" r="5" fill="#10b981" fill-opacity="0.8" />
    <text x="52" y="8" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="12" font-weight="500" letter-spacing="0.5">pranjali@workbench: ~/engineering-world</text>

    <!-- Main Identity -->
    <text x="0" y="58" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="3">PRANJALI SANTANI</text>
    <text x="1" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.8">Building my engineering world.</text>

    <!-- Track Pills -->
    <g transform="translate(0, 110)">
      <!-- Pill 1: CSE -->
      <rect x="0" y="0" width="60" height="26" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
      <text x="30" y="17" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">CSE</text>

      <!-- Pill 2: SOFTWARE ENGINEERING -->
      <rect x="70" y="0" width="195" height="26" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
      <text x="167" y="17" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">SOFTWARE ENGINEERING</text>

      <!-- Pill 3: AI / ML -->
      <rect x="275" y="0" width="80" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="315" y="17" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">AI / ML</text>
    </g>

    <!-- Core Journey Divider Line & Loop -->
    <line x1="0" y1="156" x2="768" y2="156" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <g transform="translate(0, 180)">
      <text x="0" y="0" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="12" font-weight="600" letter-spacing="2.5">
        LEARN  <tspan fill="#3b82f6">>→</tspan>  BUILD  <tspan fill="#3b82f6">>→</tspan>  BREAK  <tspan fill="#3b82f6">>→</tspan>  UNDERSTAND  <tspan fill="#3b82f6">>→</tspan>  SHIP
      </text>
    </g>
  </g>
</svg>

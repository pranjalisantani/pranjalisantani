<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="auto">
  <defs>
    <linearGradient id="aiCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>
    <linearGradient id="aiBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="836" height="156" rx="12" fill="url(#aiCardBg)" stroke="url(#aiBorderGrad)" stroke-width="1.2" />

  <!-- Section Header -->
  <g transform="translate(28, 28)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.5">COLLABORATION // AI × WORKFLOW</text>
    <text x="0" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">AI accelerates my exploration and synthesis; true engineering comes from understanding and ownership.</text>
  </g>

  <!-- Pipeline Nodes -->
  <g transform="translate(28, 86)">
    <!-- Node 1: EXPLORE -->
    <rect x="0" y="0" width="85" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="42" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">EXPLORE</text>
    <text x="96" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- Node 2: RESEARCH -->
    <rect x="110" y="0" width="95" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="157" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">RESEARCH</text>
    <text x="216" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- Node 3: BUILD -->
    <rect x="230" y="0" width="80" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="270" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">BUILD</text>
    <text x="321" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- Node 4: DEBUG -->
    <rect x="335" y="0" width="80" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="375" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">DEBUG</text>
    <text x="426" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- Node 5: VERIFY -->
    <rect x="440" y="0" width="85" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="482" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">VERIFY</text>
    <text x="536" y="21" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- Node 6: UNDERSTAND -->
    <rect x="550" y="0" width="115" height="32" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="607" y="20" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">UNDERSTAND</text>
    <text x="676" y="21" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- Node 7: OWN -->
    <rect x="690" y="0" width="80" height="32" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
    <text x="730" y="20" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">OWN ✦</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="auto">
  <defs>
    <linearGradient id="journeyCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0c1220" />
    </linearGradient>
    <linearGradient id="journeyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="836" height="196" rx="12" fill="url(#journeyCardBg)" stroke="url(#journeyBorder)" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(28, 26)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.5">EVOLUTION // THE LIFECYCLE</text>
  </g>

  <!-- Cycle Row 1 -->
  <g transform="translate(28, 52)">
    <!-- LEARN -->
    <rect x="0" y="0" width="95" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="47" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">LEARN</text>
    <text x="110" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- BUILD -->
    <rect x="125" y="0" width="95" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="172" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">BUILD</text>
    <text x="235" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- EXPERIMENT -->
    <rect x="250" y="0" width="130" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="315" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">EXPERIMENT</text>
    <text x="395" y="21" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- FAIL -->
    <rect x="410" y="0" width="85" height="32" rx="6" fill="#18181b" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.6" />
    <text x="452" y="20" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">FAIL</text>

    <!-- Turn connector -->
    <path d="M 505 16 L 530 16 C 540 16 546 22 546 32 L 546 44 C 546 54 540 60 530 60 L 505 60" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Cycle Row 2 -->
  <g transform="translate(28, 108)">
    <!-- DEBUG -->
    <rect x="0" y="0" width="95" height="32" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" />
    <text x="47" y="20" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">DEBUG</text>
    <text x="110" y="21" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- UNDERSTAND -->
    <rect x="125" y="0" width="130" height="32" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="190" y="20" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">UNDERSTAND</text>
    <text x="270" y="21" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- BUILD BETTER -->
    <rect x="285" y="0" width="140" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="355" y="20" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">BUILD BETTER</text>
    <text x="440" y="21" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="12">→</text>

    <!-- SHIP -->
    <rect x="455" y="0" width="85" height="32" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.2" />
    <text x="497" y="20" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SHIP ✦</text>
  </g>

  <!-- Closing Insight Note -->
  <g transform="translate(28, 172)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-style="italic">
      "I'm still early in the journey. That's intentional. This profile shows the engineer being built."
    </text>
  </g>
</svg>
